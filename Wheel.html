<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="wheel.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="ccm-11" aria-label="360 degree wheel navigation demo">
      <div class="ccm-11__stage">
        <div class="ccm-11__pointer" aria-hidden="true"></div>
        <nav class="ccm-11__machine" style="--n: 8" aria-label="Sections">
          <ul class="ccm-11__wheel">
            <li style="--i: 0">
              <button
                type="button"
                class="ccm-11__stop is-active"
                aria-pressed="true"
              >
                Home
              </button>
            </li>
            <li style="--i: 1">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Series
              </button>
            </li>
            <li style="--i: 2">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Films
              </button>
            </li>
            <li style="--i: 3">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Live
              </button>
            </li>
            <li style="--i: 4">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Sports
              </button>
            </li>
            <li style="--i: 5">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Kids
              </button>
            </li>
            <li style="--i: 6">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                Music
              </button>
            </li>
            <li style="--i: 7">
              <button type="button" class="ccm-11__stop" aria-pressed="false">
                My list
              </button>
            </li>
          </ul>
          <div class="ccm-11__face">
            <em>Now browsing</em><strong class="ccm-11__current">Home</strong>
            <div class="ccm-11__steer">
              <button
                type="button"
                class="ccm-11__prev"
                aria-label="Previous section"
              >
                ←</button
              ><button
                type="button"
                class="ccm-11__next"
                aria-label="Next section"
              >
                →
              </button>
            </div>
          </div>
          <p class="ccm-11__live" aria-live="polite"></p>
        </nav>
      </div>
    </section>

    <!-- Attribution — feel free to remove if you adapt this demo. -->
    
    <script src="wheel.js"></script>
  </body>
</html>
